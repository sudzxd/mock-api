name: Develop/Main CI

on:
  push:
    branches: [main, develop]

jobs:
  comprehensive-tests:
    name: Full test suite (Python ${{ matrix.python-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run linting
        run: uv run ruff check .

      - name: Run type checking
        run: uv run pyright

      - name: Run tests with coverage
        run: uv run pytest --cov=mock_api --cov-report=xml --cov-report=term-missing

      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  package-build:
    name: Package build verification
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Build package
        run: uv build

      - name: Check package metadata
        run: |
          uv run pip install twine
          uv run twine check dist/*

      - name: Test package installation
        run: |
          python -m venv test-env
          source test-env/bin/activate || test-env\\Scripts\\activate
          pip install dist/*.whl
          mock-api --version
          deactivate

      - name: Store build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: package-distributions
          path: dist/

  end-to-end-tests:
    name: End-to-end server tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Create test models file
        run: |
          cat > test_models.py << 'EOF'
          from pydantic import BaseModel
          from datetime import datetime

          class User(BaseModel):
              id: int
              name: str
              email: str
              created_at: datetime

          class Post(BaseModel):
              id: int
              title: str
              content: str
              author_id: int
          EOF

      - name: Start mock API server
        run: |
          PYTHONPATH=. uv run python -m mock_api.cli.main serve \
            --models test_models.py \
            --port 3000 \
            --generate-data \
            --data-count 10 &
          echo $! > server.pid
          sleep 5

      - name: Test API endpoints
        run: |
          # Test list users
          curl -f http://localhost:3000/api/v1/users || exit 1

          # Test get single user
          curl -f http://localhost:3000/api/v1/users/1 || exit 1

          # Test create user
          echo "Testing POST /api/v1/users..."
          curl -f -X POST http://localhost:3000/api/v1/users \
            -H "Content-Type: application/json" \
            -d '{"id":999,"name":"Test User","email":"test@example.com","created_at":"2025-01-01T00:00:00Z"}' \
            || exit 1

          # Test list posts
          curl -f http://localhost:3000/api/v1/posts || exit 1

          # Test filtering
          curl -f "http://localhost:3000/api/v1/posts?author_id=1" || exit 1

      - name: Stop server
        if: always()
        run: |
          if [ -f server.pid ]; then
            kill $(cat server.pid) || true
          fi

  performance-benchmarks:
    name: Performance benchmarks
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Download previous benchmark results
        uses: actions/cache@v4
        with:
          path: .benchmarks
          key: benchmark-results-${{ github.ref_name }}
          restore-keys: |
            benchmark-results-develop
            benchmark-results-

      - name: Run benchmarks
        run: |
          # Run benchmarks with comparison if baseline exists, otherwise just save
          if [ -d .benchmarks ]; then
            uv run pytest tests/benchmarks/ \
              --benchmark-only \
              --benchmark-json=benchmark-results.json \
              --benchmark-autosave \
              --benchmark-save-data \
              --benchmark-compare \
              --benchmark-compare-fail=mean:20% \
              -v
          else
            uv run pytest tests/benchmarks/ \
              --benchmark-only \
              --benchmark-json=benchmark-results.json \
              --benchmark-autosave \
              --benchmark-save-data \
              -v
          fi

      - name: Store benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-${{ github.sha }}
          path: |
            benchmark-results.json
            .benchmarks/
          retention-days: 90

      - name: Comment benchmark results on commit
        if: github.event_name == 'push'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const data = JSON.parse(fs.readFileSync('benchmark-results.json', 'utf8'));

            const benchmarks = data.benchmarks.map(b =>
              `| ${b.name} | ${(b.stats.mean * 1000).toFixed(2)}ms | ${(b.stats.stddev * 1000).toFixed(2)}ms |`
            ).join('\n');

            const body = `## Benchmark Results\n\n| Benchmark | Mean | Std Dev |\n` +
              `|-----------|------|---------|\\n${benchmarks}`;

            github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
              body: body
            });

  security-full:
    name: Full security scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run bandit security checks
        run: uv run bandit -c .bandit -r mock_api -f json -o bandit-report.json || true

      - name: Run pip-audit for vulnerabilities
        run: uv run pip-audit --desc --format json --output pip-audit-report.json || true

      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            bandit-report.json
            pip-audit-report.json

  code-quality:
    name: Code quality metrics
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Install quality tools
        run: uv pip install radon

      - name: Check code complexity
        run: |
          echo "=== Cyclomatic Complexity ==="
          uv run radon cc mock_api -a -nb

          echo "=== Maintainability Index ==="
          uv run radon mi mock_api -nb

      - name: Check code metrics
        run: |
          echo "=== Raw Metrics ==="
          uv run radon raw mock_api -s
