name: Reset Benchmark Baseline

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Target branch (develop, main)'
        required: true
        default: 'develop'
        type: string
      run_fresh_benchmarks:
        description: 'Run fresh benchmarks after clearing cache'
        required: true
        default: true
        type: boolean

jobs:
  reset-benchmarks:
    name: Reset benchmark baseline
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}

      - name: Clear benchmark cache
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Clearing benchmark cache for branch: ${{ inputs.branch }}"

          CACHE_KEY="benchmark-results-${{ inputs.branch }}"
          CACHE_ID=$(gh cache list --json id,key --jq ".[] | select(.key | startswith(\"$CACHE_KEY\")) | .id" | head -1)

          if [ -n "$CACHE_ID" ]; then
            gh cache delete $CACHE_ID
            echo "Deleted cache: $CACHE_KEY"
          else
            echo "No cache found for: $CACHE_KEY"
          fi

      - name: Set up Python
        if: ${{ inputs.run_fresh_benchmarks }}
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        if: ${{ inputs.run_fresh_benchmarks }}
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install dependencies
        if: ${{ inputs.run_fresh_benchmarks }}
        run: uv sync --all-extras

      - name: Run fresh benchmarks
        if: ${{ inputs.run_fresh_benchmarks }}
        run: |
          uv run pytest tests/benchmarks/ \
            --benchmark-only \
            --benchmark-json=benchmark-results.json \
            --benchmark-autosave \
            --benchmark-save-data \
            -v

      - name: Store new baseline
        if: ${{ inputs.run_fresh_benchmarks }}
        uses: actions/cache/save@v4
        with:
          path: .benchmarks
          key: benchmark-results-${{ inputs.branch }}-${{ github.run_id }}

      - name: Upload results
        if: ${{ inputs.run_fresh_benchmarks }}
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-${{ inputs.branch }}
          path: |
            benchmark-results.json
            .benchmarks/

      - name: Summary
        run: |
          echo "### Benchmark Reset Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Branch: ${{ inputs.branch }}" >> $GITHUB_STEP_SUMMARY
          echo "Cache cleared: benchmark-results-${{ inputs.branch }}" >> $GITHUB_STEP_SUMMARY
          if [ "${{ inputs.run_fresh_benchmarks }}" == "true" ]; then
            echo "Fresh benchmarks: Run and saved" >> $GITHUB_STEP_SUMMARY
          else
            echo "Fresh benchmarks: Skipped" >> $GITHUB_STEP_SUMMARY
          fi
